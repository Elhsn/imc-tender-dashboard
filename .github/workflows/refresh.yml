name: Refresh public tender snapshot
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 8,16 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 beautifulsoup4==4.14.2
      - name: Collect public source only
        id: collect
        run: |
          python - <<'PY'
          """Public-source-only snapshot generator. No credentials or private database.

          Outage-safe: fetches are retried, an unreachable source or thin result never
          replaces the last good snapshot, and on outage the step reports
          source_ok=false so the run still fails honestly after the unchanged
          snapshot is redeployed. Every attempt writes status.json (attempt time,
          outcome and short reason) separately from the snapshot's own checked_at,
          so the site can distinguish a confirmed failed refresh from merely old data.
          """
          import json, os, re, sys, time
          from datetime import datetime, timezone
          from urllib.parse import urljoin, urlsplit
          import requests
          from bs4 import BeautifulSoup
          BASE = 'https://www.imc-egypt.org'
          SOURCE = BASE + '/ar/public-tenders.html'
          STALE_AFTER_HOURS = 18  # schedule is twice daily (12h interval); flag data older than interval + 6h grace
          s = requests.Session()
          s.headers['User-Agent'] = 'IMC-Public-Dashboard/1.0'
          def page(url, attempts=3, base_wait=15):
              last = None
              for i in range(attempts):
                  try:
                      r = s.get(url, timeout=(10, 30)); r.raise_for_status()
                      if urlsplit(r.url).hostname != 'www.imc-egypt.org': raise ValueError('Unexpected host')
                      r.encoding = 'utf-8'
                      return BeautifulSoup(r.text, 'html.parser')
                  except Exception as e:
                      last = e
                      print(f'attempt {i+1}/{attempts} failed for {url}: {type(e).__name__}: {e}', flush=True)
                      if i + 1 < attempts: time.sleep(base_wait * (i + 1))
              raise last
          def normal(t):
              return re.sub(r'\s+', ' ', t.translate(str.maketrans('أإآى','اااي'))).lower()
          def write_status(ok, note='', success_at=None):
              try:
                  st = {'last_attempt_at': datetime.now(timezone.utc).isoformat(),
                        'last_attempt_ok': ok,
                        'attempt_note': note,
                        'last_success_at': success_at,
                        'stale_after_hours': STALE_AFTER_HOURS}
                  with open('status.json', 'w', encoding='utf-8') as f:
                      json.dump(st, f, ensure_ascii=False, indent=2)
              except Exception as e:
                  print('could not write status.json:', e, flush=True)
          def embedded_success_at():
              try:
                  from pathlib import Path
                  m = re.search(r'"checked_at":\s*"([^"]+)"', Path('index.html').read_text())
                  return m.group(1) if m else None
              except Exception:
                  return None
          def outage(reason, note):
              print(f'::warning title=Refresh failed::{reason}', flush=True)
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as f:
                      f.write('## Refresh failed\n\n' + reason + '\n\nThe last good published snapshot was kept unchanged. The next scheduled run retries automatically.\n')
              write_status(False, note=note, success_at=embedded_success_at())
              out = os.environ.get('GITHUB_OUTPUT')
              if out:
                  with open(out, 'a', encoding='utf-8') as f: f.write('source_ok=false\n')
              sys.exit(0)
          try:
              listing = page(SOURCE)
          except Exception as e:
              outage(f'Could not fetch {SOURCE} after retries: {type(e).__name__}: {e}', 'source unreachable')
          urls = {urljoin(SOURCE,a['href']) for a in listing.select('a[href]') if re.match(r'^https://www\.imc-egypt\.org/ar/public-tenders/item/\d+', urljoin(SOURCE,a['href']))}
          urls = sorted(urls, key=lambda u:int(re.search(r'/item/(\d+)',u)[1]), reverse=True)[:30]
          if not urls: outage(f'Listing at {SOURCE} loaded but contained no tender links; the page layout may have changed.', 'source layout changed')
          items=[]; failed=0
          for url in urls:
              try:
                  soup=page(url, attempts=2, base_wait=10)
              except Exception as e:
                  failed += 1
                  print(f'skipping {url}: {type(e).__name__}: {e}', flush=True)
                  if failed >= 5: outage(f'{failed} tender pages failed to load; treating as a source outage.', 'source unreachable')
                  continue
              title=soup.select_one('.itemTitle') or soup.find('h1') or soup.find('h2')
              text=soup.select_one('.itemFullText') or soup.select_one('.itemIntroText')
              body=text.get_text(' ',strip=True) if text else ''
              title=title.get_text(' ',strip=True) if title else 'Tender notice'
              norm=normal(title+' '+body)
              category='Other'
              for label, pattern in [('Odoo',r'\bodoo\b|(?<!\w)اودو(?!\w)'),('ERP',r'\berp\b|enterprise resource planning|تخطيط موارد'),('Software',r'\bsoftware\b|برمجيات|تطوير (?:نظام|تطبيق|برنامج)')]:
                  if re.search(pattern,norm): category=label;break
              dates=soup.select_one('.itemDateCreated')
              published=dates.get_text(' ',strip=True) if dates else ''
              excerpts=re.findall(r'(?:قبل يوم|اخر موعد|آخر موعد|الموعد النهائي|deadline|closing date)[^\n]{0,200}',body,re.I)
              # Allowlist only public title, date, source URL and deadline wording. No bodies, contacts or attachments.
              items.append({'id':re.search(r'/item/(\d+)',url)[1], 'title':title,'url':url,'published':published,'category':category,'deadline':' | '.join(excerpts[:2])})
              time.sleep(.25)
          if len(items) < min(10, len(urls)):
              outage(f'Only {len(items)} of {len(urls)} tender notices could be collected; refusing to replace the snapshot with thin data.', 'source returned too little data')
          checked_at = datetime.now(timezone.utc).isoformat()
          with open('data.json','w',encoding='utf-8') as f: json.dump({'checked_at':checked_at,'source':SOURCE,'coverage':'Latest 30 tender notices by source item ID, not the complete archive.','items':items},f,ensure_ascii=False,indent=2)
          print('Public snapshot saved:',len(items),'notices')

          from pathlib import Path
          html = Path('index.html').read_text()
          data = Path('data.json').read_text().replace('</', '<\\/')
          assert not re.search(r'[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}', data), 'Contact data refused'
          html, count = re.subn(r'(<script id="snapshot" type="application/json">).*?(</script>)', lambda m: m[1] + data + m[2], html, count=1, flags=re.S)
          assert count == 1
          Path('index.html').write_text(html)
          write_status(True, success_at=checked_at)
          out = os.environ.get('GITHUB_OUTPUT')
          if out:
              with open(out, 'a', encoding='utf-8') as f: f.write('source_ok=true\n')
          PY
      - name: Save successful snapshot
        if: steps.collect.outputs.source_ok == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Refresh public tender snapshot"
          git push
      - name: Prepare public site only
        if: always()
        run: mkdir _site && cp index.html _site/ && (cp status.json _site/ || true)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: always()
        with:
          path: _site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        if: always()
        id: deployment
      - name: Report failed refresh
        if: steps.collect.outputs.source_ok == 'false'
        run: exit 1
